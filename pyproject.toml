[build-system]
requires = ["setuptools<81.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opax"
version = "0.0.1"
requires-python = ">=3.12, <3.13"
dependencies = [
    "flax>=0.6.8",
    "jax>0.4.8",
    "jaxlib>=0.4.7",
    "matplotlib>=3.5.1",
    "numpy>=1.24.2",
    "optax>=0.1.4",
    "scipy>1.10.1",
    "wandb>=0.12.11",
    "termcolor>=1.1.0",
    "distrax>=0.1.2",
    "tensorflow_probability>0.19.0",
    "tensorstore>0.1.46",
    "gymnasium",
    "argparse-dataclass>=0.2.1",
    "tqdm",
    "seaborn",
    "cloudpickle",
    "pandas>2.1.0",
    "gpjax",
    "dm_control>=1.0.10",
    "trajax @ git+ssh://git@github.com/lenarttreven/trajax.git",
    "jaxtyping~=0.2.28",
    "moviepy",
    "chex>=0.1.92",
    "weave>=0.52.43",
    "py-spy>=0.4.2",
]

[project.optional-dependencies]
dev = [
    "seaborn",
    "control>=0.9.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
