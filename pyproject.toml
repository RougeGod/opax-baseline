[build-system]
requires = ["setuptools<81.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opax"
version = "0.0.1"
requires-python = ">=3.12, <3.13"
dependencies = [
    "flax>=0.6.8",
    "jax[cuda13]>0.4.8",
    "jaxlib>=0.4.7",
    "matplotlib>=3.5.1",
    "numpy>=1.24.2",
    "optax>=0.1.4",
    "scipy>1.10.1",
    "termcolor>=1.1.0",
    "distrax>=0.1.2",
    "tensorflow_probability>0.19.0",
    "tensorstore>0.1.46",
    "gymnasium",
    "argparse-dataclass>=0.2.1",
    "tqdm",
    "seaborn",
    "cloudpickle",
    "pandas>2.1.0",
    "gpjax",
    "gymnax",
    #"trajax @ git+ssh://git@github.com/lenarttreven/trajax.git",
    "jaxtyping~=0.2.28",
    "moviepy",
    "chex>=0.1.92",
    "weave>=0.52.43",
    "py-spy>=0.4.2",
    "orbax>=0.1.9",
    "dm-control>=1.0.50",
]

[project.optional-dependencies]
dev = [
    "seaborn",
    "control>=0.9.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.cluv]
results_path = "Desktop/Dossier/opax/opax_results"
job_script_path = "scripts/job.sh"
env = {}

[tool.cluv.sbatch_args]
mem = "16G"
time = "2:59:59"
gpus = "1"
cpus-per-task= "4"


# PAICE clusters.
[tool.cluv.clusters.tamia]
env = {UV_OFFLINE="1", WANDB_MODE="offline", SBATCH_ACCOUNT="aip-amw8"}

[tool.cluv.clusters.killarney]
env = {UV_OFFLINE="1", WANDB_MODE="offline", SBATCH_ACCOUNT="aip-amw8"}
# Killarney refuses jobs submitted from /home: clone the project and run jobs from /project.
project_dir = "/project/aip-amw8/$USER/opax"

[tool.cluv.clusters.vulcan]
env = {UV_OFFLINE="1", WANDB_MODE="offline", SBATCH_ACCOUNT="aip-amw8"}


# DRAC clusters.
[tool.cluv.clusters.rorqual]
env = {UV_OFFLINE="1", WANDB_MODE="offline", SBATCH_ACCOUNT="def-amw8"}

[tool.cluv.clusters.fir]
env = {UV_OFFLINE="0", WANDB_MODE="offline", SBATCH_ACCOUNT="def-amw8"}

[tool.cluv.clusters.nibi]
env = {UV_OFFLINE="0", WANDB_MODE="offline", SBATCH_ACCOUNT="def-amw8"}

[tool.cluv.clusters.trillium]
env = {UV_OFFLINE="1", WANDB_MODE="offline", SBATCH_ACCOUNT="def-amw8"}

[tool.cluv.clusters.trillium-gpu]
env = {UV_OFFLINE="1", WANDB_MODE="offline", SBATCH_ACCOUNT="def-amw8"}

[tool.cluv.clusters.narval]
env = {UV_OFFLINE="1", WANDB_MODE="offline", SBATCH_ACCOUNT="def-amw8"}

[tool.cluv.clusters.narval.sbatch_args]
gpus = "1"


#request MIG on rorqual/nibi/fir
[tool.cluv.clusters.rorqual.sbatch_args]
gpus = "h100_2g.20gb:1"

[tool.cluv.clusters.nibi.sbatch_args]
gpus = "h100_2g.20gb:1"

[tool.cluv.clusters.fir.sbatch_args]
gpus = "nvidia_h100_80gb_hbm3_2g.20gb:1"

[tool.cluv.clusters.tamia.sbatch_args]
gpus = "4"
